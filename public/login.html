<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ElevateCare</title>
    <link rel="stylesheet" href="css/tailwind.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" integrity="sha384-3B6NwesSXE7YJlcLI9RpRqGf2p/EgVH8BgoKTaUrmKNDkHPStTQ3EyoYjCGXaOTS" crossorigin="anonymous">
</head>
<body class="bg-gray-100 font-sans min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-sm mb-8">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800"><i class="fa-solid fa-elevator text-blue-600"></i> ElevateCare</h1>
            <p class="text-gray-500 mt-1 font-semibold">Sign in to the operations dashboard</p>
        </div>

        <form id="loginForm" class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 space-y-4">
            <div>
                <label class="block text-xs font-bold text-gray-500 mb-1">Username</label>
                <input type="text" id="username" required autofocus class="w-full border rounded p-2.5 text-sm outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-500 mb-1">Password</label>
                <div class="relative">
                    <input type="password" id="password" required class="w-full border rounded p-2.5 pr-10 text-sm outline-none focus:ring-2 focus:ring-blue-500">
                    <button type="button" id="togglePassword" tabindex="-1" class="absolute right-0 top-0 h-full w-10 flex items-center justify-center text-gray-600 hover:text-blue-600 text-base">
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>

            <div id="errorMessage" class="hidden p-2.5 rounded text-sm font-bold text-center bg-red-100 text-red-700"></div>

            <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg shadow-md transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-right-to-bracket"></i> Sign In
            </button>
        </form>
    </div>

    <script src="js/config.js"></script>
    <script src="js/footer.js"></script>
    <script>
        // Where each role lands — keep in sync with landingPageFor() in
        // src/server.js.
        function landingPageFor(role) {
            return role === 'reports' ? 'reports.html' : 'dashboard.html';
        }

        // If already logged in, skip straight to that role's landing page.
        (async function checkExistingSession() {
            try {
                const res = await fetch(`${API_BASE}/auth/me`);
                const data = await res.json();
                if (data.loggedIn) window.location.href = landingPageFor(data.role);
            } catch (err) { /* ignore — just show the login form */ }
        })();

        document.getElementById('togglePassword').addEventListener('click', function () {
            const input = document.getElementById('password');
            const icon = this.querySelector('i');
            const showing = input.type === 'text';
            input.type = showing ? 'password' : 'text';
            icon.classList.toggle('fa-eye', showing);
            icon.classList.toggle('fa-eye-slash', !showing);
        });

        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const btn = document.getElementById('submitBtn');
            const errorBox = document.getElementById('errorMessage');
            errorBox.classList.add('hidden');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Signing in...';

            try {
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        password: document.getElementById('password').value
                    })
                });
                const result = await response.json();

                if (response.ok) {
                    window.location.href = landingPageFor(result.role);
                } else {
                    errorBox.textContent = result.error || 'Login failed.';
                    errorBox.classList.remove('hidden');
                }
            } catch (err) {
                errorBox.textContent = 'Server error — is the app running?';
                errorBox.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Sign In';
            }
        });
    </script>
</body>
</html>
