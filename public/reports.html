<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics & Reports - ElevateCare</title>
    <script>
        // Applied before Tailwind paints anything, so there's no flash of the
        // wrong theme on load. Toggle logic itself lives in js/theme.js.
        (function () {
            try {
                var stored = localStorage.getItem('theme');
                var isDark = stored ? stored === 'dark' : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
                if (isDark) document.documentElement.classList.add('dark');
            } catch (e) { /* ignore */ }
        })();
    </script>
    <link rel="stylesheet" href="css/tailwind.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/theme.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 font-sans flex flex-col lg:flex-row h-screen overflow-hidden">

    <div id="sidebar-root"></div>
    <script src="js/config.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/footer.js"></script>

    <div class="flex-1 p-4 sm:p-6 lg:p-8 overflow-y-auto pb-12">

        <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-3 mb-6">
            <div>
                <h1 class="text-2xl sm:text-3xl font-bold text-gray-800 dark:text-gray-100">Breakdown Analytics</h1>
                <p class="text-gray-500 dark:text-gray-400">Analyze faults by time period, total counts, and category percentages.</p>
            </div>
            <button onclick="window.print()" class="bg-gray-800 hover:bg-black text-white font-semibold px-5 py-2.5 rounded-lg shadow flex items-center justify-center gap-2 transition">
                <i class="fa-solid fa-print"></i> Print Report
            </button>
        </div>

        <div class="bg-white dark:bg-gray-800 p-5 rounded-xl shadow-sm mb-6 border border-gray-100 dark:border-gray-700 flex flex-col sm:flex-row flex-wrap gap-4 sm:items-end">
            <div>
                <label class="block text-xs font-bold text-gray-500 dark:text-gray-400 mb-1">From Date</label>
                <input type="date" id="fromDate" class="border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none w-full sm:w-40 text-gray-700 dark:text-gray-300">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-500 dark:text-gray-400 mb-1">To Date</label>
                <input type="date" id="toDate" class="border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none w-full sm:w-40 text-gray-700 dark:text-gray-300">
            </div>
            <button onclick="fetchFilteredData()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-6 py-2 rounded-lg transition shadow-sm h-[38px] flex items-center justify-center gap-2">
                <i class="fa-solid fa-chart-simple"></i> Generate Analytics
            </button>
            <button onclick="fetchLiveData()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 dark:text-gray-300 font-bold px-4 py-2 rounded-lg transition shadow-sm h-[38px] flex items-center justify-center gap-2 sm:ml-auto">
                <i class="fa-solid fa-rotate"></i> Show All Time Data
            </button>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-6">
            
            <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 col-span-1 flex flex-col">
                <h3 class="text-md font-bold text-gray-800 dark:text-gray-100 mb-4 border-b pb-2">Visual Breakdown Share</h3>
                <div class="relative flex-1 w-full flex justify-center min-h-[300px]">
                    <canvas id="categoryChart"></canvas>
                </div>
            </div>

            <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 col-span-1 lg:col-span-2">
                <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-2 mb-4 border-b pb-2">
                    <h3 id="summaryTitle" class="text-md font-bold text-gray-800 dark:text-gray-100">Category Summary (All Time)</h3>
                    <div class="bg-blue-100 text-blue-800 border border-blue-200 px-4 py-1.5 rounded-lg font-black text-sm shadow-sm flex items-center gap-2 self-start sm:self-auto">
                        <i class="fa-solid fa-calculator"></i> Total Breakdowns: <span id="totalBreakdowns" class="text-lg">0</span>
                    </div>
                </div>
                <div id="categorySummaryGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-3 h-[300px] overflow-y-auto pr-2"></div>
            </div>
        </div>

        <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 overflow-x-auto">
            <div class="p-4 bg-gray-50 dark:bg-gray-900/40 border-b border-gray-200 dark:border-gray-700">
                <h3 class="font-bold text-gray-700 dark:text-gray-300">Detailed Breakdown Log</h3>
            </div>
            <table class="w-full text-left border-collapse min-w-[700px]">
                <thead>
                    <tr class="bg-white dark:bg-gray-800 text-gray-500 dark:text-gray-400 text-xs uppercase tracking-wider border-b">
                        <th class="py-3 px-4 font-bold">Date & Time</th>
                        <th class="py-3 px-4 font-bold">Unit No</th>
                        <th class="py-3 px-4 font-bold">Category</th>
                        <th class="py-3 px-4 font-bold">Nature of Breakdown</th>
                        <th class="py-3 px-4 font-bold text-center">Attended By</th> </tr>
                </thead>
                <tbody id="breakdownLogTable" class="divide-y divide-gray-100 dark:divide-gray-700 text-sm text-gray-700 dark:text-gray-300"></tbody>
            </table>
        </div>
    </div>

    <script>
        let myChart = null;

        const styleMap = {
            'Door System Failure': { border: 'border-red-500', text: 'text-red-500', bg: 'bg-red-100 text-red-700', hex: '#EF4444' },
            'Minor Breakdown': { border: 'border-yellow-500', text: 'text-yellow-600', bg: 'bg-yellow-100 text-yellow-700', hex: '#F59E0B' },
            'Electrical / Control Failure': { border: 'border-blue-500', text: 'text-blue-500', bg: 'bg-blue-100 text-blue-700', hex: '#3B82F6' },
            'Mechanical Failure': { border: 'border-orange-500', text: 'text-orange-500', bg: 'bg-orange-100 text-orange-700', hex: '#F97316' },
            'Power Failure': { border: 'border-purple-500', text: 'text-purple-500', bg: 'bg-purple-100 text-purple-700', hex: '#8B5CF6' },
            'Communication Failure': { border: 'border-teal-500', text: 'text-teal-500', bg: 'bg-teal-100 text-teal-700', hex: '#14B8A6' },
            'Safety Error': { border: 'border-pink-500', text: 'text-pink-500', bg: 'bg-pink-100 text-pink-700', hex: '#EC4899' },
            'Major Breakdown': { border: 'border-gray-500', text: 'text-gray-500 dark:text-gray-400', bg: 'bg-gray-100 dark:bg-gray-900 text-gray-700 dark:text-gray-300', hex: '#6B7280' },
            'Passenger Entrapment': { border: 'border-gray-900', text: 'text-gray-900 dark:text-gray-100', bg: 'bg-gray-200 text-gray-900 dark:text-gray-100', hex: '#111827' },
            'Default': { border: 'border-blue-400', text: 'text-blue-400', bg: 'bg-blue-50 text-blue-600', hex: '#60A5FA' }
        };

        async function fetchLiveData() {
            document.getElementById('fromDate').value = '';
            document.getElementById('toDate').value = '';
            try {
                const response = await fetch(`${API_BASE}/all-breakdowns`);
                const data = await response.json();
                processAndRenderData(data, "All Time");
            } catch (error) { console.error("Error:", error); }
        }

        async function fetchFilteredData() {
            const from = document.getElementById('fromDate').value;
            const to = document.getElementById('toDate').value;
            if(!from || !to) { alert("Please select both From and To dates!"); return; }
            try {
                const response = await fetch(`${API_BASE}/breakdowns-filter?from=${from}&to=${to}`);
                const data = await response.json();
                processAndRenderData(data, `${from} to ${to}`);
            } catch (error) { console.error("Error:", error); }
        }

        function processAndRenderData(data, periodText) {
            document.getElementById('summaryTitle').textContent = `Category Summary (${periodText})`;
            const total = data.length;
            document.getElementById('totalBreakdowns').textContent = total;

            if (total === 0) {
                document.getElementById('categorySummaryGrid').innerHTML = '<div class="col-span-2 text-center py-10 text-gray-500 dark:text-gray-400 font-bold">No data found.</div>';
                document.getElementById('breakdownLogTable').innerHTML = '<tr><td colspan="5" class="text-center py-6 text-gray-500 dark:text-gray-400">No records found.</td></tr>';
                if(myChart) myChart.destroy();
                return;
            }

            const counts = {};
            data.forEach(item => { counts[item.category] = (counts[item.category] || 0) + 1; });

            const labels = []; const values = []; const colors = []; let gridHTML = '';
            const sortedCategories = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);

            sortedCategories.forEach(cat => {
                const count = counts[cat];
                const percentage = ((count / total) * 100).toFixed(1);
                const style = styleMap[cat] || styleMap['Default'];
                labels.push(cat); values.push(count); colors.push(style.hex);

                gridHTML += `
                    <div class="bg-gray-50 dark:bg-gray-900/40 border-l-4 ${style.border} p-3 rounded shadow-sm flex justify-between items-center">
                        <div>
                            <h4 class="font-bold text-gray-700 dark:text-gray-300 text-sm">${cat}</h4>
                            <p class="text-[11px] font-bold ${style.text} mt-0.5">${percentage}%</p>
                        </div>
                        <div class="text-xl font-black text-gray-800 dark:text-gray-100">${count}</div>
                    </div>
                `;
            });
            document.getElementById('categorySummaryGrid').innerHTML = gridHTML;

            if (myChart) myChart.destroy();
            myChart = new Chart(document.getElementById('categoryChart').getContext('2d'), {
                type: 'doughnut',
                data: { labels: labels, datasets: [{ data: values, backgroundColor: colors, borderWidth: 2, borderColor: '#ffffff' }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, cutout: '65%' }
            });

            // ⚠️ POPULATE TABLE WITH ATTENDED BY COLUMN ⚠️
            let tableHTML = '';
            data.forEach(row => {
                const style = styleMap[row.category] || styleMap['Default'];
                const dateObj = new Date(row.informed_date);
                const formattedDate = dateObj.toISOString().split('T')[0];

                tableHTML += `
                    <tr class="hover:bg-gray-50 border-b">
                        <td class="py-3 px-4">
                            <span class="font-semibold text-gray-800 dark:text-gray-100">${formattedDate}</span><br>
                            <span class="text-xs text-gray-500 dark:text-gray-400">${row.informed_time}</span>
                        </td>
                        <td class="py-3 px-4 font-bold text-blue-600">${row.unit_no}</td>
                        <td class="py-3 px-4"><span class="${style.bg} px-2 py-1 rounded text-xs font-bold">${row.category}</span></td>
                        <td class="py-3 px-4">
                            <span class="block text-gray-800 dark:text-gray-100">${row.nature_of_breakdown}</span>
                            <span class="block text-xs text-green-600 mt-1"><i class="fa-solid fa-wrench"></i> Action: ${row.actions_taken || 'Pending'}</span>
                        </td>
                        <td class="py-3 px-4 text-center font-semibold text-gray-600 dark:text-gray-400 bg-gray-50 dark:bg-gray-900/40/50">
                            ${row.attended_by ? `<span class="bg-gray-200/80 text-gray-700 dark:text-gray-300 px-2 py-1 rounded text-xs border border-gray-300 shadow-sm inline-block"><i class="fa-solid fa-user-gear text-gray-500 dark:text-gray-400 mr-1"></i>${row.attended_by}</span>` : '<span class="text-xs text-red-500 font-bold"><i class="fa-solid fa-circle-minus mr-1"></i>Not Assigned</span>'}
                        </td>
                    </tr>
                `;
            });
            document.getElementById('breakdownLogTable').innerHTML = tableHTML;
        }

        window.onload = fetchLiveData;
    </script>
</body>
</html>
