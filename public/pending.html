<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Sync - ElevateCare</title>
    <link rel="stylesheet" href="css/tailwind.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans flex flex-col lg:flex-row h-screen overflow-hidden">

    <div id="sidebar-root"></div>
    <script src="js/config.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/footer.js"></script>

    <div class="flex-1 p-4 sm:p-6 lg:p-8 overflow-y-auto pb-12">
        <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-3 mb-2">
            <h1 class="text-2xl sm:text-3xl font-bold text-gray-800">Pending Mobile Submissions</h1>
            <div class="flex flex-wrap gap-2">
                <button id="simulateBtn" onclick="addTestData()" class="hidden bg-green-100 hover:bg-green-200 text-green-700 px-4 py-2 rounded-lg font-bold transition text-sm"><i class="fa-solid fa-plus"></i> Simulate Mobile Input</button>
                <button onclick="loadPending()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded-lg font-semibold transition text-sm"><i class="fa-solid fa-rotate-right"></i> Refresh Sync</button>
            </div>
        </div>
        <p class="text-gray-500 mb-8">Review, edit, and approve breakdown data sent by technicians before saving to the main database.</p>

        <div id="pendingContainer" class="space-y-6">
            <!-- Dynamic Cards Will Load Here -->
            <div class="text-center py-10 text-gray-500 font-bold"><i class="fa-solid fa-spinner fa-spin mr-2"></i> Loading pending data...</div>
        </div>
    </div>



    <!-- Photo viewer -->
    <div id="photoModal" class="fixed inset-0 bg-black/70 hidden z-50 flex items-center justify-center backdrop-blur-sm p-4" onclick="closePhotoModal()">
        <div class="bg-white p-4 rounded-xl shadow-lg w-full max-w-3xl max-h-[92vh] overflow-y-auto" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center mb-3 pb-2 border-b">
                <h3 class="text-lg font-bold text-gray-800"><i class="fa-solid fa-camera-retro text-blue-500 mr-2"></i><span id="photoModalTitle">Photos</span></h3>
                <button onclick="closePhotoModal()" class="text-gray-400 hover:text-red-500 transition text-xl"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="modalPhotoContainer" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
            <p class="text-xs text-center text-gray-400 mt-3 font-semibold">Photos uploaded via the ElevateCare mobile app.</p>
        </div>
    </div>

    <script>
        // Opens the photo viewer with the given uploaded filenames (served from /uploads).
        function openPhotos(filenames, title) {
            document.getElementById('photoModalTitle').textContent = title || 'Photos';
            document.getElementById('modalPhotoContainer').innerHTML = filenames.map(f =>
                `<a href="/uploads/${encodeURIComponent(f)}" target="_blank" rel="noopener"><img src="/uploads/${encodeURIComponent(f)}" alt="Breakdown photo" class="w-full rounded-lg border border-gray-200 object-contain bg-gray-50 max-h-80"></a>`
            ).join('');
            document.getElementById('photoModal').classList.remove('hidden');
        }
        function closePhotoModal() {
            document.getElementById('photoModal').classList.add('hidden');
        }

        // Category dropdown options for one card, with the app's chosen category pre-selected.
        function categoryOptionsFor(optionsHtml, selected) {
            return selected ? optionsHtml.replace(`value="${escapeHtml(selected)}"`, `value="${escapeHtml(selected)}" selected`) : optionsHtml;
        }

        // Demo-only "Simulate Mobile Input" is shown outside production only.
        fetch(`${API_BASE}/auth/me`).then(r => r.json()).then(me => {
            if (me.devMode) document.getElementById('simulateBtn').classList.remove('hidden');
        }).catch(() => {});

        async function loadPending() {
            const container = document.getElementById('pendingContainer');
            try {
                const [response, techResponse, catResponse] = await Promise.all([
                    fetch(`${API_BASE}/pending`),
                    fetch(`${API_BASE}/technician-names`),
                    fetch(`${API_BASE}/breakdown-types`)
                ]);
                const data = await response.json();
                const technicians = techResponse.ok ? await techResponse.json() : [];
                const breakdownTypes = catResponse.ok ? await catResponse.json() : [];
                const categoryOptionsHtml = breakdownTypes.length
                    ? breakdownTypes.map(t => `<option value="${escapeHtml(t.name)}">${escapeHtml(t.name)}</option>`).join('')
                    : '<option value="">No breakdown types added yet</option>';

                if (data.length === 0) {
                    container.innerHTML = '<div class="bg-white p-8 rounded-xl shadow-sm text-center text-gray-400 font-bold text-lg border border-gray-100"><i class="fa-solid fa-check-circle text-4xl text-green-400 mb-3 block"></i> No pending submissions. Everything is up to date!</div>';
                    document.getElementById('badgeCount').classList.add('hidden');
                    return;
                }

                // Update Notification Badge
                const badge = document.getElementById('badgeCount');
                badge.textContent = data.length;
                badge.classList.remove('hidden');

                let html = '';
                data.forEach(item => {
                    const informedDate = item.informed_date ? item.informed_date.split('T')[0] : '';
                    const attendedDate = item.attended_date ? item.attended_date.split('T')[0] : '';

                    const selectedTechs = (item.attended_by || '').split(' / ').map(t => t.trim());
                    const techCheckboxesHtml = technicians.length
                        ? technicians.map(t => `
                            <label class="flex items-center space-x-2 mb-1 cursor-pointer hover:bg-gray-50 p-1 rounded"><input type="checkbox" value="${escapeHtml(t.name)}" class="tech-checkbox w-4 h-4 text-blue-600 rounded" ${selectedTechs.includes(t.name) ? 'checked' : ''}> <span class="font-semibold text-gray-700 text-xs">${escapeHtml(t.name)}</span></label>
                        `).join('')
                        : '<p class="text-xs text-gray-400 p-1">No technicians added yet — add some from Settings.</p>';

                    html += `<div class="bg-white p-6 rounded-xl shadow-sm border border-yellow-300 relative transition hover:shadow-md" id="card-${item.id}">
                        <div class="absolute top-0 right-0 bg-yellow-400 text-yellow-900 text-xs font-bold px-3 py-1 rounded-bl-lg rounded-tr-xl">Needs Review</div>
                        
                        <div class="flex flex-col md:flex-row gap-6 md:gap-8">
                            <!-- Photo Section -->
                            <div class="w-full sm:w-56 sm:mx-0 mx-auto flex flex-col gap-2">
                                ${(item.photos && item.photos.length) ? `
                                <div class="grid grid-cols-2 gap-2">
                                    ${item.photos.slice(0, 4).map((f, idx) => `
                                        <button type="button" data-photos="${escapeHtml(JSON.stringify(item.photos))}" data-unit="${escapeHtml(item.unit_no)}" onclick="openPhotos(JSON.parse(this.dataset.photos), this.dataset.unit + ' — submission photos')" class="relative h-20 rounded-lg overflow-hidden border border-gray-200 bg-gray-100 group">
                                            <img src="/uploads/${encodeURIComponent(f)}" alt="Photo ${idx + 1}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                                            ${idx === 3 && item.photos.length > 4 ? `<span class="absolute inset-0 bg-black/55 text-white text-sm font-bold flex items-center justify-center">+${item.photos.length - 3}</span>` : ''}
                                        </button>`).join('')}
                                </div>
                                <p class="text-[11px] text-gray-500 text-center font-semibold"><i class="fa-solid fa-camera mr-1"></i> ${item.photos.length} photo${item.photos.length > 1 ? 's' : ''} from the mobile app</p>`
                                : `
                                <div class="h-32 bg-gray-50 rounded-lg flex flex-col items-center justify-center border-2 border-dashed border-gray-200 text-gray-300">
                                    <i class="fa-solid fa-image text-3xl mb-1"></i><span class="text-[11px] font-semibold">No photos attached</span>
                                </div>`}
                            </div>

                            <!-- Editing Form -->
                            <div class="flex-1 grid grid-cols-1 md:grid-cols-3 gap-x-6 gap-y-4">
                                
                                <div><label class="text-[11px] font-bold text-gray-400 uppercase tracking-wider">Unit No</label>
                                <input type="text" id="unit-${item.id}" value="${escapeHtml(item.unit_no)}" class="w-full border-b border-gray-300 bg-blue-50/50 p-1.5 outline-none text-sm font-bold text-blue-700 rounded-t"></div>
                                
                                <div><label class="text-[11px] font-bold text-gray-400 uppercase tracking-wider">Job Status</label>
                                <select id="status-${item.id}" class="w-full border-b border-gray-300 bg-gray-50 p-1.5 outline-none text-sm font-bold text-green-600 rounded-t">
                                    <option value="Job Done" ${item.job_status === 'Job Done' ? 'selected' : ''}>Job Done</option>
                                    <option value="Pending" ${item.job_status === 'Pending' ? 'selected' : ''}>Pending</option>
                                </select></div>
                                
                                <!-- Category added here for Main DB compatibility -->
                                <div><label class="text-[11px] font-bold text-gray-400 uppercase tracking-wider">Category</label>
                                <select id="cat-${item.id}" class="w-full border-b border-gray-300 bg-gray-50 p-1.5 outline-none text-sm font-bold text-gray-700 rounded-t">
                                    ${categoryOptionsFor(categoryOptionsHtml, item.category)}
                                </select></div>

                                <div><label class="text-[11px] font-bold text-gray-400 uppercase tracking-wider">Informed By</label>
                                <input type="text" id="infby-${item.id}" value="${escapeHtml(item.informed_by)}" class="w-full border-b border-gray-300 bg-gray-50 p-1.5 outline-none text-sm font-semibold text-gray-800 rounded-t"></div>
                                
                                <div class="md:col-span-2"><label class="text-[11px] font-bold text-gray-400 uppercase tracking-wider">Informed Date & Time</label>
                                <div class="flex gap-2">
                                    <input type="date" id="infdate-${item.id}" value="${informedDate}" class="border-b border-gray-300 bg-gray-50 p-1.5 outline-none text-sm text-gray-700 w-1/2 rounded-t">
                                    <input type="time" id="inftime-${item.id}" value="${escapeHtml(item.informed_time)}" class="border-b border-gray-300 bg-gray-50 p-1.5 outline-none text-sm text-gray-700 w-1/2 rounded-t">
                                </div></div>

                                <div><label class="text-[11px] font-bold text-gray-400 uppercase tracking-wider">Attended By (Select Technicians)</label>
                                <div id="techbox-${item.id}" class="w-full border rounded p-1.5 text-sm bg-gray-50 h-24 overflow-y-auto border-gray-300 shadow-inner">${techCheckboxesHtml}</div></div>
                                
                                <div class="md:col-span-2"><label class="text-[11px] font-bold text-gray-400 uppercase tracking-wider">Attended Date & Time</label>
                                <div class="flex gap-2">
                                    <input type="date" id="attdate-${item.id}" value="${attendedDate}" class="border-b border-gray-300 bg-gray-50 p-1.5 outline-none text-sm text-gray-700 w-1/2 rounded-t">
                                    <input type="time" id="atttime-${item.id}" value="${escapeHtml(item.attended_time)}" class="border-b border-gray-300 bg-gray-50 p-1.5 outline-none text-sm text-gray-700 w-1/2 rounded-t">
                                </div></div>

                                <div class="md:col-span-3 mt-2"><label class="text-[11px] font-bold text-gray-400 uppercase tracking-wider text-red-500"><i class="fa-solid fa-triangle-exclamation mr-1"></i> Nature of Breakdown (Raw Entry)</label>
                                <input type="text" id="nature-${item.id}" value="${escapeHtml(item.nature_of_breakdown)}" class="w-full border-b-2 border-yellow-400 bg-yellow-50 p-2 outline-none text-sm font-bold text-red-600 rounded-t"></div>
                                
                                <div class="md:col-span-3"><label class="text-[11px] font-bold text-gray-400 uppercase tracking-wider">Action Taken</label>
                                <input type="text" id="action-${item.id}" value="${escapeHtml(item.actions_taken)}" class="w-full border-b border-gray-300 bg-gray-50 p-2 outline-none text-sm font-semibold text-gray-800 rounded-t"></div>
                            </div>
                        </div>

                        <div class="mt-6 flex flex-col-reverse sm:flex-row sm:justify-end gap-3 pt-4 border-t border-gray-100">
                            <button onclick="discardItem(${item.id})" class="bg-red-50 text-red-600 px-5 py-2 rounded-lg font-bold hover:bg-red-100 transition"><i class="fa-solid fa-trash-can mr-1"></i> Discard</button>
                            <button onclick="approveItem(${item.id})" class="bg-blue-600 text-white px-8 py-2 rounded-lg font-bold hover:bg-blue-700 transition shadow-md whitespace-nowrap"><i class="fa-solid fa-database mr-2"></i> Approve & Save to DB</button>
                        </div>
                    </div>`;
                });
                container.innerHTML = html;

            } catch (error) {
                container.innerHTML = '<div class="text-center py-10 text-red-500 font-bold">Error loading data. Is server running?</div>';
            }
        }

        // Approve Function
        async function approveItem(id) {
            const unitNo = document.getElementById(`unit-${id}`).value.trim();
            if (!unitNo) { showToast('Unit No is required before approving.', 'error'); return; }

            const confirmed = await showConfirm({
                title: 'Approve and save?',
                message: `Save this submission for "${unitNo}" to the main Breakdowns database?`,
                okText: 'Approve',
                okColor: 'bg-blue-600 hover:bg-blue-700',
                icon: 'fa-solid fa-database',
                iconColor: 'bg-blue-100 text-blue-600'
            });
            if (!confirmed) return;

            const payload = {
                unit_no: unitNo,
                job_status: document.getElementById(`status-${id}`).value,
                category: document.getElementById(`cat-${id}`).value,
                informed_by: document.getElementById(`infby-${id}`).value,
                informed_date: document.getElementById(`infdate-${id}`).value,
                informed_time: document.getElementById(`inftime-${id}`).value,
                attended_by: Array.from(document.querySelectorAll(`#techbox-${id} input:checked`)).map(cb => cb.value).join(' / '),
                attended_date: document.getElementById(`attdate-${id}`).value || null,
                attended_time: document.getElementById(`atttime-${id}`).value || null,
                nature_of_breakdown: document.getElementById(`nature-${id}`).value,
                actions_taken: document.getElementById(`action-${id}`).value
            };

            try {
                const response = await fetch(`${API_BASE}/pending/approve/${id}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    showToast('Submission approved and saved!', 'success');
                    loadPending(); // Refresh list (also refreshes the nav badge)
                } else {
                    const result = await response.json().catch(() => ({}));
                    showToast(result.error || GENERIC_ERROR, 'error');
                }
            } catch (error) {
                console.error(error);
                showToast(GENERIC_ERROR, 'error');
            }
        }

        // Discard Function
        async function discardItem(id) {
            const confirmed = await showConfirm({
                title: 'Discard submission?',
                message: 'Discard this mobile submission? This cannot be undone.',
                okText: 'Discard',
                okColor: 'bg-red-600 hover:bg-red-700',
                icon: 'fa-solid fa-trash',
                iconColor: 'bg-red-100 text-red-600'
            });
            if (!confirmed) return;

            try {
                const response = await fetch(`${API_BASE}/pending/${id}`, { method: 'DELETE' });
                if (response.ok) {
                    showToast('Submission discarded.', 'success');
                    loadPending();
                } else {
                    const result = await response.json().catch(() => ({}));
                    showToast(result.error || GENERIC_ERROR, 'error');
                }
            } catch (error) {
                console.error(error);
                showToast(GENERIC_ERROR, 'error');
            }
        }

        // Dummy Data Injector (development only)
        async function addTestData() {
            try {
                const response = await fetch(`${API_BASE}/pending/test`, { method: 'POST' });
                if (!response.ok) { showToast(GENERIC_ERROR, 'error'); return; }
            } catch (error) {
                console.error(error);
                showToast(GENERIC_ERROR, 'error');
                return;
            }
            loadPending();
        }

        // Run on load
        window.onload = loadPending;
    </script>
</body>
</html>
