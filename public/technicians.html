<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technicians - ElevateCare</title>
    <script>
        // Applied before Tailwind paints anything, so there's no flash of the
        // wrong theme on load. Toggle logic itself lives in js/theme.js.
        (function () {
            try {
                var stored = localStorage.getItem('theme');
                var isDark = stored ? stored === 'dark' : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
                if (isDark) document.documentElement.classList.add('dark');
            } catch (e) { /* ignore */ }
        })();
    </script>
    <link rel="stylesheet" href="css/tailwind.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/theme.css">
</head>
<body class="bg-gray-100 dark:bg-gray-900 font-sans flex flex-col lg:flex-row h-screen overflow-hidden">

    <div id="sidebar-root"></div>
    <script src="js/config.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/footer.js"></script>

    <div class="flex-1 p-4 sm:p-6 lg:p-8 overflow-y-auto pb-12">

        <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-3 mb-8">
            <div>
                <h1 class="text-2xl sm:text-3xl font-bold text-gray-800 dark:text-gray-100">Technicians & Staff</h1>
                <p class="text-gray-500 dark:text-gray-400">Manage field technicians and assign tasks.</p>
            </div>
            <button onclick="openAddModal()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-5 py-2.5 rounded-lg shadow flex items-center justify-center gap-2 transition">
                <i class="fa-solid fa-user-plus"></i> Add Technician
            </button>
        </div>

        <div class="bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm mb-6 flex flex-col sm:flex-row gap-4 sm:items-center border border-gray-100 dark:border-gray-700">
            <div class="relative flex-1">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-gray-400 dark:text-gray-500"></i>
                <input type="text" id="searchInput" placeholder="Search by name, ID or skills..." class="w-full pl-10 pr-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
            </div>
            <select id="statusFilter" class="border rounded-lg px-4 py-2 text-sm text-gray-600 dark:text-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="">Status: All</option>
                <option value="Available">🟢 Available</option>
                <option value="OnJob">🟡 On Job</option>
                <option value="Leave">🔴 On Leave</option>
            </select>
        </div>

        <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 overflow-x-auto">
            <table class="w-full text-left border-collapse min-w-[720px]">
                <thead>
                    <tr class="bg-gray-50 dark:bg-gray-900/40 text-gray-600 dark:text-gray-400 text-xs uppercase tracking-wider border-b">
                        <th class="py-4 px-6 font-bold">Technician Profile</th>
                        <th class="py-4 px-6 font-bold">Skills</th>
                        <th class="py-4 px-6 font-bold text-center">Status</th>
                        <th class="py-4 px-6 font-bold">Current Assignment</th>
                        <th class="py-4 px-6 font-bold text-center">Action</th>
                    </tr>
                </thead>
                <tbody id="techTableBody" class="divide-y divide-gray-100 dark:divide-gray-700 text-sm text-gray-700 dark:text-gray-300">
                    <tr><td colspan="5" class="text-center py-8 text-gray-400 dark:text-gray-500"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Loading technicians...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Add Technician Modal -->
    <div id="addModal" class="fixed inset-0 bg-black/60 hidden z-50 flex items-center justify-center backdrop-blur-sm p-4">
        <div class="bg-white dark:bg-gray-800 rounded-xl shadow-lg w-full max-w-md p-6">
            <div class="flex justify-between items-center mb-4">
                <h2 id="modalTitle" class="text-lg font-bold text-gray-800 dark:text-gray-100">Add Technician</h2>
                <button onclick="closeAddModal()" class="text-gray-400 dark:text-gray-500 hover:text-red-500 transition text-xl"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="techForm" class="space-y-4">
                <input type="hidden" id="tech_id">
                <div>
                    <label class="block text-xs font-bold text-gray-500 dark:text-gray-400 mb-1">Technician ID</label>
                    <input type="text" id="tech_code" placeholder="e.g. TECH-021" class="w-full border rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 dark:text-gray-400 mb-1">Name *</label>
                    <input type="text" id="tech_name" required class="w-full border rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 dark:text-gray-400 mb-1">Skills</label>
                    <input type="text" id="tech_skills" placeholder="e.g. Electrical, Door Systems" class="w-full border rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 dark:text-gray-400 mb-1">Status</label>
                    <select id="tech_status" class="w-full border rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="Available">🟢 Available</option>
                        <option value="OnJob">🟡 On Job</option>
                        <option value="Leave">🔴 On Leave</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 dark:text-gray-400 mb-1">Current Assignment</label>
                    <input type="text" id="tech_assignment" placeholder="e.g. ES 2.07a (optional)" class="w-full border rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeAddModal()" class="px-4 py-2.5 rounded-lg text-sm font-semibold text-gray-600 dark:text-gray-400 hover:bg-gray-100 transition">Cancel</button>
                    <button type="submit" id="submitBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-5 py-2.5 rounded-lg shadow transition">
                        <i class="fa-solid fa-user-plus mr-1"></i> Save
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Confirm / Alert Dialog -->
    <div id="confirmModal" class="fixed inset-0 bg-black/60 hidden z-[60] flex items-center justify-center backdrop-blur-sm p-4">
        <div class="bg-white dark:bg-gray-800 rounded-xl shadow-lg w-full max-w-sm p-6 text-center">
            <div id="confirmIcon" class="w-12 h-12 mx-auto mb-4 rounded-full flex items-center justify-center text-xl"></div>
            <h3 id="confirmTitle" class="text-lg font-bold text-gray-800 dark:text-gray-100 mb-1"></h3>
            <p id="confirmMessage" class="text-sm text-gray-500 dark:text-gray-400 mb-6"></p>
            <div class="flex justify-center gap-3">
                <button id="confirmCancelBtn" class="px-5 py-2.5 rounded-lg text-sm font-semibold text-gray-600 dark:text-gray-400 hover:bg-gray-100 transition">Cancel</button>
                <button id="confirmOkBtn" class="px-5 py-2.5 rounded-lg text-sm font-semibold text-white shadow transition">Confirm</button>
            </div>
        </div>
    </div>

    <!-- Toast notifications: bottom of screen, color-coded, auto-dismiss -->
    <div id="toastContainer" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-[70] flex flex-col items-center gap-2 pointer-events-none w-full px-4"></div>

    <script>
        let allTechnicians = [];

        // Consistent fallback wording — every add/update/delete error path uses
        // this same message unless the server gave a more specific one.
        const GENERIC_ERROR = 'Something went wrong. Please try again.';

        // Success/error feedback: bottom-of-screen toast, colored by type,
        // auto-dismisses after 3s. Used for add/update/delete results instead of
        // an inline message box, per the app's UI convention.
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const styles = { success: 'bg-green-600', error: 'bg-red-600' };
            const icon = type === 'error' ? 'fa-triangle-exclamation' : 'fa-circle-check';

            const toast = document.createElement('div');
            toast.className = `pointer-events-auto ${styles[type] || styles.success} text-white px-5 py-3 rounded-lg shadow-lg text-sm font-semibold flex items-center gap-2 opacity-0 transition-opacity duration-300 max-w-md`;
            toast.innerHTML = `<i class="fa-solid ${icon}"></i> <span>${escapeHtml(message)}</span>`;
            container.appendChild(toast);

            requestAnimationFrame(() => toast.classList.remove('opacity-0'));

            setTimeout(() => {
                toast.classList.add('opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Promise-based replacement for window.confirm() — resolves true/false
        // instead of blocking the thread, and matches the app's own modal styling
        // instead of the browser's native chrome dialog.
        function showConfirm({ title, message, okText = 'Confirm', okColor = 'bg-blue-600 hover:bg-blue-700', icon = 'fa-solid fa-circle-question', iconColor = 'bg-blue-100 text-blue-600', hideCancel = false }) {
            return new Promise(resolve => {
                const modal = document.getElementById('confirmModal');
                const okBtn = document.getElementById('confirmOkBtn');
                const cancelBtn = document.getElementById('confirmCancelBtn');

                document.getElementById('confirmTitle').textContent = title;
                document.getElementById('confirmMessage').textContent = message;

                const iconEl = document.getElementById('confirmIcon');
                iconEl.className = `w-12 h-12 mx-auto mb-4 rounded-full flex items-center justify-center text-xl ${iconColor}`;
                iconEl.innerHTML = `<i class="${icon}"></i>`;

                okBtn.textContent = okText;
                okBtn.className = `px-5 py-2.5 rounded-lg text-sm font-semibold text-white shadow transition ${okColor}`;
                cancelBtn.classList.toggle('hidden', hideCancel);

                modal.classList.remove('hidden');

                function cleanup(result) {
                    modal.classList.add('hidden');
                    okBtn.removeEventListener('click', onOk);
                    cancelBtn.removeEventListener('click', onCancel);
                    resolve(result);
                }
                function onOk() { cleanup(true); }
                function onCancel() { cleanup(false); }

                okBtn.addEventListener('click', onOk);
                cancelBtn.addEventListener('click', onCancel);
            });
        }

        const STATUS_BADGE = {
            Available: '<span class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-xs font-bold"><i class="fa-solid fa-circle text-[8px] mr-1"></i> Available</span>',
            OnJob: '<span class="bg-yellow-100 text-yellow-700 px-3 py-1 rounded-full text-xs font-bold"><i class="fa-solid fa-wrench mr-1"></i> On Job</span>',
            Leave: '<span class="bg-red-100 text-red-700 px-3 py-1 rounded-full text-xs font-bold">On Leave</span>'
        };

        const AVATAR_COLORS = { Available: '0D8ABC', OnJob: 'F59E0B', Leave: 'EF4444' };

        function escapeHtml(str) {
            return String(str ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        function renderTechnicians() {
            const term = searchInput.value.trim().toLowerCase();
            const statusValue = statusFilter.value;

            const filtered = allTechnicians.filter(t => {
                const matchesTerm = !term ||
                    (t.name || '').toLowerCase().includes(term) ||
                    (t.tech_code || '').toLowerCase().includes(term) ||
                    (t.skills || '').toLowerCase().includes(term);
                const matchesStatus = !statusValue || t.status === statusValue;
                return matchesTerm && matchesStatus;
            });

            if (filtered.length === 0) {
                techTableBody.innerHTML = '<tr><td colspan="5" class="text-center py-8 text-gray-400 dark:text-gray-500 font-bold">No technicians match your search.</td></tr>';
                return;
            }

            techTableBody.innerHTML = filtered.map(t => {
                const badge = STATUS_BADGE[t.status] || STATUS_BADGE.Available;
                const color = AVATAR_COLORS[t.status] || '0D8ABC';
                const isLeave = t.status === 'Leave';
                const assignment = t.current_assignment
                    ? `<span class="font-semibold text-gray-800 dark:text-gray-100">${escapeHtml(t.current_assignment)}</span>`
                    : '<span class="text-gray-400 dark:text-gray-500 italic">None</span>';

                return `
                    <tr class="hover:bg-gray-50 ${isLeave ? 'opacity-70' : ''}">
                        <td class="py-4 px-6 flex items-center gap-4">
                            <img src="https://ui-avatars.com/api/?name=${encodeURIComponent(t.name)}&background=${color}&color=fff" class="w-10 h-10 rounded-full shadow-sm ${isLeave ? 'grayscale' : ''}">
                            <div>
                                <span class="font-bold text-gray-900 dark:text-gray-100 block">${escapeHtml(t.name)}</span>
                                <span class="text-xs text-gray-500 dark:text-gray-400">ID: ${escapeHtml(t.tech_code || '—')}</span>
                            </div>
                        </td>
                        <td class="py-4 px-6 text-gray-600 dark:text-gray-400">${escapeHtml(t.skills || '—')}</td>
                        <td class="py-4 px-6 text-center">${badge}</td>
                        <td class="py-4 px-6">${assignment}</td>
                        <td class="py-4 px-6 text-center">
                            <button onclick="openEditModal(${t.id})" class="text-blue-600 hover:bg-blue-50 p-2 rounded-md transition"><i class="fa-solid fa-pen-to-square"></i></button>
                            <button onclick="deleteTechnician(${t.id})" class="text-red-600 hover:bg-red-50 p-2 rounded-md transition"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        async function loadTechnicians() {
            try {
                const response = await fetch(`${API_BASE}/technicians`);
                allTechnicians = await response.json();
                renderTechnicians();
            } catch (error) {
                console.error("Error fetching technicians:", error);
                techTableBody.innerHTML = '<tr><td colspan="5" class="text-center py-8 text-red-400 font-bold">Failed to load technicians.</td></tr>';
            }
        }

        function openAddModal() {
            document.getElementById('techForm').reset();
            document.getElementById('tech_id').value = '';
            document.getElementById('modalTitle').textContent = 'Add Technician';
            document.getElementById('submitBtn').innerHTML = '<i class="fa-solid fa-user-plus mr-1"></i> Save';
            document.getElementById('addModal').classList.remove('hidden');
        }

        function openEditModal(id) {
            const t = allTechnicians.find(x => x.id === id);
            if (!t) return;

            document.getElementById('tech_id').value = t.id;
            document.getElementById('tech_code').value = t.tech_code || '';
            document.getElementById('tech_name').value = t.name || '';
            document.getElementById('tech_skills').value = t.skills || '';
            document.getElementById('tech_status').value = t.status || 'Available';
            document.getElementById('tech_assignment').value = t.current_assignment || '';
            document.getElementById('modalTitle').textContent = 'Edit Technician';
            document.getElementById('submitBtn').innerHTML = '<i class="fa-solid fa-check mr-1"></i> Update';
            document.getElementById('addModal').classList.remove('hidden');
        }

        function closeAddModal() {
            document.getElementById('addModal').classList.add('hidden');
            document.getElementById('techForm').reset();
        }

        document.getElementById('techForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const id = document.getElementById('tech_id').value;
            const isEdit = !!id;
            const name = document.getElementById('tech_name').value.trim();

            // Adding is low-risk and reversible (just delete it after), so it only
            // gets a confirmation message once it succeeds. Editing overwrites an
            // existing technician's details, so it's confirmed up front instead.
            if (isEdit) {
                const confirmed = await showConfirm({
                    title: 'Save changes?',
                    message: `Save changes to "${name}"?`,
                    okText: 'Save',
                    okColor: 'bg-blue-600 hover:bg-blue-700',
                    icon: 'fa-solid fa-pen-to-square',
                    iconColor: 'bg-blue-100 text-blue-600'
                });
                if (!confirmed) return;
            }

            const btn = document.getElementById('submitBtn');

            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving...';
            btn.disabled = true;

            const formData = {
                tech_code: document.getElementById('tech_code').value.trim(),
                name,
                skills: document.getElementById('tech_skills').value.trim(),
                status: document.getElementById('tech_status').value,
                current_assignment: document.getElementById('tech_assignment').value.trim()
            };

            try {
                const response = await fetch(`${API_BASE}/technicians${isEdit ? '/' + id : ''}`, {
                    method: isEdit ? 'PUT' : 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });
                const result = await response.json();

                if (response.ok) {
                    closeAddModal();
                    loadTechnicians();
                    showToast(isEdit ? 'Technician updated successfully!' : 'Technician added successfully!', 'success');
                } else {
                    showToast(result.error || GENERIC_ERROR, 'error');
                }
            } catch (err) {
                console.error(err);
                showToast(GENERIC_ERROR, 'error');
            } finally {
                btn.innerHTML = isEdit ? '<i class="fa-solid fa-check mr-1"></i> Update' : '<i class="fa-solid fa-user-plus mr-1"></i> Save';
                btn.disabled = false;
            }
        });

        async function deleteTechnician(id) {
            const t = allTechnicians.find(x => x.id === id);
            if (!t) return;

            const confirmed = await showConfirm({
                title: 'Delete technician?',
                message: `Delete technician "${t.name}"? This cannot be undone.`,
                okText: 'Delete',
                okColor: 'bg-red-600 hover:bg-red-700',
                icon: 'fa-solid fa-trash',
                iconColor: 'bg-red-100 text-red-600'
            });
            if (!confirmed) return;

            try {
                const response = await fetch(`${API_BASE}/technicians/${id}`, { method: 'DELETE' });
                if (response.ok) {
                    loadTechnicians();
                    showToast('Technician deleted successfully!', 'success');
                } else {
                    const result = await response.json();
                    showToast(result.error || GENERIC_ERROR, 'error');
                }
            } catch (err) {
                console.error(err);
                showToast(GENERIC_ERROR, 'error');
            }
        }

        const searchInput = document.getElementById('searchInput');
        const statusFilter = document.getElementById('statusFilter');
        const techTableBody = document.getElementById('techTableBody');

        // 'input' fires on every keystroke (not just on blur/enter like 'change'
        // would), which is what makes filtering happen letter by letter as you type.
        searchInput.addEventListener('input', renderTechnicians);
        statusFilter.addEventListener('change', renderTechnicians);

        window.onload = loadTechnicians;
    </script>
</body>
</html>
